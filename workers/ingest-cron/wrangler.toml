name = "boomwatch-ingest"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[triggers]
crons = ["13 0 * * *", "7 3 * * *", "59 4 * * *", "19 6 * * *", "13 18 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "boomwatch-db"
database_id = "49a99423-9462-440a-8400-46722e1dc357"

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1